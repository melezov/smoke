<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>smoke</title>
<meta name="theme-color" content="#1F2933">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
  :root {
    color-scheme: light dark;
    --bg: #fdf7ff; --fg: #1d1b20; --muted: #49454f; --tonal: #e8def8; --bar: #e8def8; --accent: #5b4b8a;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #141218; --fg: #e6e0e9; --muted: #cac4d0; --tonal: #4a4458; --bar: #4a4458; --accent: #d0bcff; }
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg);
    font: 16px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  body { display: flex; flex-direction: column;
    padding: max(12px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) 0 max(16px, env(safe-area-inset-left)); }
  h1 { font-size: 22px; font-weight: 400; margin: 4px 0 12px; }
  button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; -webkit-tap-highlight-color: transparent; }

  /* The strip: three packs to a screen; the rest is reached by sliding or with the arrows. */
  #strip { position: relative; }
  #buttons { display: flex; gap: 8px; overflow-x: auto; scroll-snap-type: x proximity; scrollbar-width: none; overscroll-behavior-x: contain; }
  #buttons::-webkit-scrollbar { display: none; }
  .tap { flex: 0 0 calc((100% - 16px) / 3); scroll-snap-align: start; background: var(--tonal); border-radius: 16px;
    min-height: 104px; padding: 8px; display: flex; align-items: center; justify-content: center;
    touch-action: pan-x; user-select: none; }
  .tap:active { filter: brightness(.92); }
  .tap img { display: block; width: 100%; height: auto; max-height: 120px; object-fit: contain; pointer-events: none; }
  .arrow { position: absolute; top: 50%; transform: translateY(-50%); width: 32px; height: 48px; border-radius: 16px;
    background: color-mix(in srgb, var(--bg) 85%, transparent); color: var(--fg); font-size: 26px; line-height: 1;
    box-shadow: 0 1px 4px rgba(0, 0, 0, .35); z-index: 1; }
  #left { left: -8px; }
  #right { right: -8px; }

  #pending { background: var(--bar); border-radius: 12px; margin-top: 12px; padding: 4px 4px 4px 16px;
    display: flex; align-items: center; }
  #pending .what { flex: 1; font-size: 16px; font-weight: 500; }
  .text { color: var(--accent); padding: 10px 12px; border-radius: 20px; font-weight: 500; }
  #log { flex: 1; overflow-y: auto; margin-top: 12px; padding-bottom: calc(72px + env(safe-area-inset-bottom)); }
  h2 { position: sticky; top: 0; background: var(--bg); margin: 0; padding: 6px 0; font-size: 14px; font-weight: 500; }
  .row { display: flex; align-items: center; min-height: 44px; font-size: 14px; }
  .time { width: 76px; font-variant-numeric: tabular-nums; }
  .name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .x { font-size: 18px; padding: 8px 16px; }

  #gear { position: fixed; right: max(16px, env(safe-area-inset-right)); bottom: max(16px, env(safe-area-inset-bottom));
    width: 48px; height: 48px; border-radius: 24px; background: var(--tonal); display: flex; align-items: center; justify-content: center;
    box-shadow: 0 1px 4px rgba(0, 0, 0, .35); }
  #gear svg { width: 24px; height: 24px; }
  dialog { border: 0; border-radius: 20px; padding: 0; width: min(92vw, 440px); max-height: 86vh; background: var(--bg); color: var(--fg); }
  dialog::backdrop { background: rgba(0, 0, 0, .5); }
  #settings[open] { display: flex; flex-direction: column; }
  #products { overflow-y: auto; padding: 4px 16px; }
  h3 { position: sticky; top: 0; background: var(--bg); margin: 0; padding: 12px 0 6px; font-size: 14px; font-weight: 500; color: var(--muted); }
  .product { display: flex; align-items: center; gap: 12px; min-height: 56px; font-size: 14px; }
  .product input { width: 20px; height: 20px; accent-color: var(--accent); flex: none; }
  .product img { width: 64px; height: 44px; object-fit: contain; flex: none; }
  .bar { display: flex; justify-content: flex-end; padding: 4px 8px 8px; }
</style>
</head>
<body>
<h1>smoke</h1>
<div id="strip">
  <button id="left" class="arrow" aria-label="Earlier packs" hidden>‹</button>
  <div id="buttons"></div>
  <button id="right" class="arrow" aria-label="More packs" hidden>›</button>
</div>
<div id="pending" hidden></div>
<div id="log"></div>
<button id="gear" aria-label="Settings">
  <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M19.14,12.94c0.04,-0.3 0.06,-0.61 0.06,-0.94c0,-0.32 -0.02,-0.64 -0.07,-0.94l2.03,-1.58c0.18,-0.14 0.23,-0.41 0.12,-0.61l-1.92,-3.32c-0.12,-0.22 -0.37,-0.29 -0.59,-0.22l-2.39,0.96c-0.5,-0.38 -1.03,-0.7 -1.62,-0.94L14.4,2.81c-0.04,-0.24 -0.24,-0.41 -0.48,-0.41h-3.84c-0.24,0 -0.43,0.17 -0.47,0.41L9.25,5.35C8.66,5.59 8.12,5.92 7.63,6.29L5.24,5.33c-0.22,-0.08 -0.47,0 -0.59,0.22L2.74,8.87C2.62,9.08 2.66,9.34 2.86,9.48l2.03,1.58C4.84,11.36 4.8,11.69 4.8,12s0.02,0.64 0.07,0.94l-2.03,1.58c-0.18,0.14 -0.23,0.41 -0.12,0.61l1.92,3.32c0.12,0.22 0.37,0.29 0.59,0.22l2.39,-0.96c0.5,0.38 1.03,0.7 1.62,0.94l0.36,2.54c0.05,0.24 0.24,0.41 0.48,0.41h3.84c0.24,0 0.44,-0.17 0.47,-0.41l0.36,-2.54c0.59,-0.24 1.13,-0.56 1.62,-0.94l2.39,0.96c0.22,0.08 0.47,0 0.59,-0.22l1.92,-3.32c0.12,-0.22 0.07,-0.47 -0.12,-0.61L19.14,12.94zM12,15.6c-1.98,0 -3.6,-1.62 -3.6,-3.6s1.62,-3.6 3.6,-3.6s3.6,1.62 3.6,3.6S13.98,15.6 12,15.6z"/></svg>
</button>
<dialog id="settings" aria-label="Packs on the strip">
  <div id="products"></div>
  <div class="bar"><button id="done" class="text">Done</button></div>
</dialog>
<script type="module" src="app.js"></script>
</body>
</html>
